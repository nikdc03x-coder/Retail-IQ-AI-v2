[project]
name = "retailiq-ai-v2"
version = "2.0.0"
description = "Explainable Retail Sales Forecasting & Decision Intelligence Platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

